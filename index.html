<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#060b14">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon5.png">
    <meta name="apple-mobile-web-app-title" content="AI Builder">
    <meta name="theme-color" content="#060b14">
    <title>AI Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        .theme-light {
            --bg-primary: #ffffff; --bg-secondary: #f8f9fa; --bg-tertiary: #e9ecef;
            --text-primary: #212529; --text-secondary: #6c757d;
            --accent: #007bff; --accent-hover: #0056b3; --border: #dee2e6;
            --shadow: rgba(0,0,0,0.08); --chat-user: #007bff; --chat-ai: #e9ecef;
        }
        .theme-dark {
            --bg-primary: #121212; --bg-secondary: #1e1e1e; --bg-tertiary: #2c2c2c;
            --text-primary: #e0e0e0; --text-secondary: #a0a0a0;
            --accent: #4dabf7; --accent-hover: #339af0; --border: #333333;
            --shadow: rgba(0,0,0,0.4); --chat-user: #4dabf7; --chat-ai: #2c2c2c;
        }
        .theme-neutral {
            --bg-primary: #f5f1eb; --bg-secondary: #ebe5dc; --bg-tertiary: #ddd5c9;
            --text-primary: #3d3d3d; --text-secondary: #6b6b6b;
            --accent: #8b7355; --accent-hover: #6d5a43; --border: #c9bfb0;
            --shadow: rgba(0,0,0,0.06); --chat-user: #8b7355; --chat-ai: #ebe5dc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            overflow: hidden; height: 100vh; height: 100dvh;
        }

        .header {
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            padding: calc(var(--safe-top) + 10px) 12px 10px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .logo-icon {
            width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white;
        }
        .theme-switchers { display: flex; gap: 6px; }
        .theme-btn {
            width: 34px; height: 34px; border: 2px solid var(--border); border-radius: 50%;
            background: var(--bg-primary); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
        .theme-btn svg { width: 16px; height: 16px; color: var(--text-secondary); }
        .theme-btn.active svg { color: var(--accent); }

        .main-container {
            display: flex; height: calc(100vh - 50px); height: calc(100dvh - 50px);
        }
        
        /* CHAT PANEL */
        .chat-panel {
            flex: 1; display: flex; flex-direction: column; background: var(--bg-primary);
            max-width: 400px; border-right: 1px solid var(--border);
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px;
            line-height: 1.4; word-wrap: break-word;
        }
        .message.user { align-self: flex-end; background: var(--chat-user); color: white; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background: var(--chat-ai); color: var(--text-primary); border-bottom-left-radius: 4px; }
        .message.error { background: #dc3545; color: white; }

        .chat-input-container {
            padding: 10px 12px calc(var(--safe-bottom) + 10px); background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }
        .chat-input-wrapper { display: flex; gap: 8px; align-items: flex-end; }
        .chat-input {
            flex: 1; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 20px;
            padding: 10px 14px; font-size: 14px; color: var(--text-primary); resize: none;
            max-height: 100px; min-height: 40px; font-family: inherit;
        }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none;
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .send-btn:disabled { opacity: 0.5; }
        .send-btn svg { width: 18px; height: 18px; }

        /* PREVIEW PANEL */
        .preview-panel {
            flex: 1; display: flex; flex-direction: column; background: var(--bg-primary);
        }
        .preview-tabs {
            display: flex; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .preview-tab {
            flex: 1; min-width: 80px; padding: 12px 8px; background: none; border: none;
            color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer;
            border-bottom: 3px solid transparent; white-space: nowrap;
        }
        .preview-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .preview-content { flex: 1; position: relative; overflow: hidden; }
        .preview-frame { width: 100%; height: 100%; border: none; background: white; }
        .code-view {
            width: 100%; height: 100%; padding: 12px; background: var(--bg-tertiary);
            color: var(--text-primary); font-family: monospace; font-size: 12px;
            overflow: auto; white-space: pre-wrap; display: none;
        }

        /* MOBILE BACK BUTTON */
        .mobile-back-btn {
            display: none; position: absolute; top: calc(var(--safe-top) + 10px); left: 12px;
            z-index: 10; background: var(--bg-secondary); color: var(--text-primary);
            border: 1px solid var(--border); padding: 8px 14px; border-radius: 18px;
            font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px var(--shadow);
        }

        /* MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-secondary); border-radius: 16px; padding: 20px;
            max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .modal-subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.4; }
        .modal-subtitle a { color: var(--accent); text-decoration: none; }
        .modal-input {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-primary); color: var(--text-primary); font-size: 14px; margin-bottom: 12px;
        }
        .modal-btn {
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none;
            border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
        }
        .test-btn {
            width: 100%; padding: 10px; background: transparent; border: 1px solid var(--accent);
            color: var(--accent); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .api-key-btn {
            background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-secondary);
            padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer;
        }

        .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dot {
            width: 7px; height: 7px; background: var(--text-secondary); border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

        /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .chat-panel {
                max-width: 100%;
                border-right: none;
                border-bottom: none;
                width: 100%;
            }
            
            .preview-panel {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 50;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                background: var(--bg-primary);
            }
            
            .preview-panel.mobile-show {
                display: flex;
                animation: slideUp 0.3s ease;
            }
            
            @keyframes slideUp {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }
            
            .mobile-back-btn {
                display: block;
            }
            
            .chat-input {
                font-size: 16px; /* Предотвращает зум на iOS */
            }
            
            .message {
                font-size: 15px;
                padding: 12px 16px;
            }
            
            .header {
                padding: calc(var(--safe-top) + 8px) 10px 8px;
            }
            
            .logo {
                font-size: 15px;
            }
        }

        @media (min-width: 769px) {
            .mobile-back-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body class="theme-light">

    <header class="header">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <span>AI Builder</span>
        </div>
        <div class="theme-switchers">
            <button class="theme-btn active" data-theme="light" title="Светлая">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <button class="theme-btn" data-theme="dark" title="Темная">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="theme-btn" data-theme="neutral" title="Нейтральная">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
            </button>
        </div>
        <button class="api-key-btn" onclick="showApiKeyModal()" style="margin-left: 8px;"> API</button>
    </header>

    <div class="main-container">
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    Привет! 👋 Я ваш AI-помощник. Опишите веб-приложение, которое хотите создать (например: <em>"Красивый калькулятор в темной теме"</em>), и я сгенерирую готовый код.
                </div>
            </div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea class="chat-input" id="chatInput" placeholder="Опишите ваше приложение..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="preview-panel" id="previewPanel">
            <button class="mobile-back-btn" onclick="hidePreview()">← Назад к чату</button>
            <div class="preview-tabs">
                <button class="preview-tab active" onclick="switchTab('preview')">👁 Предпросмотр</button>
                <button class="preview-tab" onclick="switchTab('code')">💻 Код</button>
                <button class="preview-tab" onclick="copyCode()">📋 Копировать</button>
                <button class="preview-tab" onclick="downloadCode()">⬇️ Скачать</button>
            </div>
            <div class="preview-content">
                <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
                <div class="code-view" id="codeView"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="apiKeyModal">
        <div class="modal-content">
            <div class="modal-title">🔑 API Key</div>
            <div class="modal-subtitle">
                Получите ключ на <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a><br>
                Войдите → Create Key
            </div>
            <input type="password" class="modal-input" id="apiKeyInput" placeholder="Введите ключ (sk-or-...)">
            <button class="modal-btn" onclick="saveApiKey()">Сохранить</button>
            <button class="test-btn" onclick="testConnection()">🔍 Проверить связь</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
        const FREE_ROUTER = 'openrouter/free';
        let chatHistory = [];
        let currentCode = '';
        let isGenerating = false;

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const previewFrame = document.getElementById('previewFrame');
        const codeView = document.getElementById('codeView');
        const previewPanel = document.getElementById('previewPanel');
        const apiKeyModal = document.getElementById('apiKeyModal');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // THEMES
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.body.className = `theme-${theme}`;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('theme', theme);
            });
        });
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.className = `theme-${savedTheme}`;
        const savedBtn = document.querySelector(`[data-theme="${savedTheme}"]`);
        if (savedBtn) {
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            savedBtn.classList.add('active');
        }

        function showApiKeyModal() {
            apiKeyInput.value = localStorage.getItem('api_key') || '';
            apiKeyModal.classList.add('show');
        }
        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) { alert('Введите ключ'); return; }
            localStorage.setItem('api_key', key);
            apiKeyModal.classList.remove('show');
            addMessage('ai', '✅ API-ключ сохранён');
        }
        function getApiKey() { return (localStorage.getItem('api_key') || '').trim(); }

        apiKeyModal.addEventListener('click', e => { if (e.target === apiKeyModal) apiKeyModal.classList.remove('show'); });

        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
        });
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function testConnection() {
            const key = apiKeyInput.value.trim();
            if (!key) { alert('Сначала введите ключ'); return; }
            const btn = document.querySelector('.test-btn');
            btn.textContent = '⏳ Проверяю...'; btn.disabled = true;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ model: FREE_ROUTER, messages: [{ role: 'user', content: 'OK' }], max_tokens: 10 })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                alert('✅ API работает!');
            } catch (error) {
                alert(`❌ Ошибка: ${error.message}`);
            } finally {
                btn.textContent = ' Проверить связь'; btn.disabled = false;
            }
        }

        async function sendMessage() {
            const prompt = chatInput.value.trim();
            if (!prompt || isGenerating) return;
            const apiKey = getApiKey();
            if (!apiKey) { showApiKeyModal(); return; }

            addMessage('user', prompt);
            chatInput.value = ''; chatInput.style.height = 'auto';
            isGenerating = true; sendBtn.disabled = true;
            const typingMsg = addTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: FREE_ROUTER,
                        messages: [
                            { role: 'system', content: 'Ты эксперт по веб-разработке. Создавай полноценные HTML-приложения. Возвращай ТОЛЬКО код от <!DOCTYPE html> до </html>. Никаких пояснений.' },
                            ...chatHistory.slice(-10),
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.3,
                        max_tokens: 8000
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                let rawCode = data.choices[0].message.content;
                rawCode = rawCode.replace(/^```html\n?/i, '').replace(/```$/i, '').trim();

                if (!rawCode.includes('<!DOCTYPE html') && !rawCode.includes('<html')) {
                    throw new Error('Модель не вернула HTML код');
                }

                currentCode = rawCode;
                chatHistory.push({ role: 'user', content: prompt });
                chatHistory.push({ role: 'assistant', content: rawCode });
                if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

                typingMsg.remove();
                addMessage('ai', '✅ Готово! Нажмите "Предпросмотр" чтобы увидеть результат.');
                previewFrame.srcdoc = rawCode;
                codeView.textContent = rawCode;

                // На мобильных автоматически показываем превью
                if (window.innerWidth <= 768) {
                    setTimeout(() => showPreview(), 300);
                }

            } catch (error) {
                typingMsg.remove();
                addMessage('ai', `❌ Ошибка: ${error.message}`, 'error');
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
            }
        }

        function addMessage(role, text, type = '') {
            const msg = document.createElement('div');
            msg.className = `message ${role} ${type}`;
            msg.innerHTML = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addTypingIndicator() {
            const msg = document.createElement('div');
            msg.className = 'message ai';
            msg.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            chatMessages.appendChild(msg);
            return msg;
        }

        function switchTab(tab) {
            document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'preview') {
                previewFrame.style.display = 'block';
                codeView.style.display = 'none';
            } else {
                previewFrame.style.display = 'none';
                codeView.style.display = 'block';
            }
        }

        function showPreview() {
            previewPanel.classList.add('mobile-show');
        }

        function hidePreview() {
            previewPanel.classList.remove('mobile-show');
        }

        async function copyCode() {
            if (!currentCode) return;
            try {
                await navigator.clipboard.writeText(currentCode);
                alert('📋 Код скопирован');
            } catch (e) { alert('Не удалось скопировать'); }
        }

        function downloadCode() {
            if (!currentCode) return;
            const blob = new Blob([currentCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'app.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        if (!getApiKey()) {
            setTimeout(() => addMessage('ai', '💡 Нажмите  API чтобы добавить ключ с openrouter.ai/keys'), 500);
        }
    </script>
</body>
</html>
